# Minimal Supabase CLI config for IJAARO (local optional).
# Remote project: tjadzwrcllsbkrkkkzjd

[project]
id = "tjadzwrcllsbkrkkkzjd"

[api]
enabled = true
port = 54321

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
# Include activation redirect used by provision-renter inviteUserByEmail.
# Hosted project Auth URL config must also allow the production /set-password URL.
additional_redirect_urls = ["http://localhost:5173", "http://localhost:5173/set-password"]

[auth.email]
enable_signup = true
enable_confirmations = false
# Hosted SMTP / Auth email delivery is NOT proven by this file.
# provision-renter stays fail-closed until PROVISION_RENTER_EMAIL_DELIVERY_READY=true.

# Public listing photos: anon visitors call with the anon JWT (supabase-js default).
# Eligibility is enforced inside the function (tenant resolve + listed + available).
[functions.public-listing-photos]
verify_jwt = true

# Monthly rent automation: caller must present service role Bearer or MONTHLY_RENT_CRON_SECRET.
# Dashboard / external cron should not rely on end-user JWTs.
[functions.generate-monthly-rent-charges]
verify_jwt = false

# Welcome email: end-user JWT required (sends only to the authenticated address).
[functions.send-welcome-email]
verify_jwt = true
