<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" role="img" aria-labelledby="title desc">
  <title id="title">IJAARO</title>
  <desc id="desc">IJAARO — Integrated Rental Property and Utility Management System</desc>

  <!-- Horizontal logo: emblem LEFT, brand + tagline RIGHT -->
  <g id="emblem" transform="translate(40, 34)">
    <!-- House (navy) -->
    <path fill="#0B1F3A" d="
      M18 102
      V58
      L56 24
      L94 58
      V102
      H18 Z"/>
    <rect x="76" y="20" width="12" height="24" rx="1.5" fill="#0B1F3A"/>
    <!-- 4-pane window -->
    <rect x="44" y="62" width="24" height="24" rx="1.5" fill="#FFFFFF"/>
    <rect x="54.5" y="62" width="3" height="24" fill="#0B1F3A"/>
    <rect x="44" y="72.5" width="24" height="3" fill="#0B1F3A"/>

    <!-- Green property bars -->
    <rect x="104" y="92" width="18" height="44" rx="2.5" fill="#1FA85A"/>
    <rect x="126" y="68" width="18" height="68" rx="2.5" fill="#1FA85A"/>
    <rect x="148" y="44" width="18" height="92" rx="2.5" fill="#1FA85A"/>

    <!-- Water droplet (bright blue) -->
    <path fill="#2B8CFF" d="
      M40 150
      C40 150 12 120 12 96
      C12 76 26 62 40 62
      C54 62 68 76 68 96
      C68 120 40 150 40 150 Z"/>
    <ellipse cx="32" cy="88" rx="6.5" ry="9.5" fill="#FFFFFF" opacity="0.35"/>

    <!-- Green leaf/swoosh (bottom-right arc) -->
    <path fill="#1FA85A" d="
      M72 152
      C104 178 150 178 178 148
      C192 134 192 116 178 108
      C168 128 140 148 104 148
      C90 148 78 150 72 152 Z"/>

    <!-- Yellow electricity bolt inside swoosh -->
    <path fill="#F5C400" d="
      M132 118
      L116 140
      L126 140
      L118 162
      L146 132
      L134 132
      L142 118
      Z"/>
  </g>

  <!-- Text RIGHT of emblem, vertically centered -->
  <g id="wordmark" transform="translate(240, 0)">
    <text
      x="0"
      y="118"
      fill="#0B1F3A"
      font-family="Montserrat, 'Segoe UI', Arial, Helvetica, sans-serif"
      font-size="80"
      font-weight="800"
      letter-spacing="3.5"
    >IJAARO</text>
    <text
      x="2"
      y="154"
      fill="#1A3358"
      font-family="Montserrat, 'Segoe UI', Arial, Helvetica, sans-serif"
      font-size="17.5"
      font-weight="500"
      letter-spacing="0.2"
    >Integrated Rental Property and Utility Management System</text>
  </g>
</svg>
